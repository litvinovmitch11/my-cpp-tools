name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check repository hygiene
        run: ./scripts/hygiene.sh

  go:
    name: Go
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Check formatting
        run: ./scripts/check-go-format.sh
      - name: Run vet
        working-directory: backend
        run: go vet ./...
      - name: Run race tests and coverage
        run: ./scripts/go-coverage.sh
      - name: Upload Go coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: go-coverage
          path: backend/coverage.out
          if-no-files-found: error

  cpp:
    name: C++
    runs-on: ubuntu-26.04
    env:
      CC: clang-22
      CXX: clang++-22
      CMAKE_PREFIX_PATH: /usr/lib/llvm-22
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install LLVM and Clang development tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-22 clang-format-22 clang-tidy-22 cmake llvm-22-dev libclang-22-dev ninja-build
      - name: Configure
        run: |
          cmake -S cpp -B cpp/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++-22 \
            -DLLVM_DIR=/usr/lib/llvm-22/lib/cmake/llvm \
            -DClang_DIR=/usr/lib/llvm-22/lib/cmake/clang
      - name: Check formatting
        run: cmake --build cpp/build --target format-check
      - name: Run clang-tidy
        run: cmake --build cpp/build --target tidy
      - name: Build and run CTest
        run: |
          cmake --build cpp/build --parallel
          ctest --test-dir cpp/build --output-on-failure
      - name: Run C++ coverage
        run: ./scripts/cpp-coverage.sh
      - name: Upload C++ coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cpp-coverage
          path: cpp/build-coverage/coverage/lcov.info
          if-no-files-found: error

  web:
    name: Web
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Check formatting, lint, and types
        working-directory: web
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
      - name: Run unit coverage
        working-directory: web
        run: npm run test:coverage
      - name: Build production assets
        working-directory: web
        run: npm run build
      - name: Upload web coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-coverage
          path: web/coverage
          if-no-files-found: error

  e2e:
    name: End-to-end
    runs-on: ubuntu-26.04
    needs: [hygiene, go, cpp, web]
    env:
      CC: clang-22
      CXX: clang++-22
      CMAKE_PREFIX_PATH: /usr/lib/llvm-22
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install LLVM and Clang development tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-22 cmake llvm-22-dev libclang-22-dev ninja-build
      - name: Run the complete pipeline
        env:
          CI: "true"
        run: ./scripts/e2e.sh
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore
